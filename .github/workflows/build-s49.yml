name: Build Felucca Kontrol S-Series MK3 Edition
# retrigger

on:
  workflow_dispatch:
  push:
    branches: [main, port-felucca-1.1.5.1]
    paths:
      - ".github/workflows/build-s49.yml"
      - "tools/apply_s49.py"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Kontrol S-Series MK3 patch repository
        uses: actions/checkout@v5

      - name: Checkout pinned Felucca 1.1.5.1 source
        run: |
          git clone https://github.com/hugelton/Felucca.git upstream
          git -C upstream checkout 213df5a094c24d10706fdffd7fb46678c6f07eeb
          python3 tools/apply_s49.py

      - name: Python build dependencies
        run: python3 -m pip install --user Pillow fonttools

      - name: JieLi toolchain
        run: |
          cd upstream
          tools/get_toolchain.sh

      - name: Cache JieLi AC79 SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-sdk-v1.2.1-2023-12-13

      - name: JieLi AC79 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "SDK download attempt $attempt/3"
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            if timeout 180 git -c http.version=HTTP/1.1 clone --depth 1 \
              --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git \
              "$HOME/fw-AC79_AIoT_SDK"; then
              exit 0
            fi
            sleep 5
          done
          echo "Gitee SDK download failed after 3 attempts"
          exit 1

      - name: Build test firmware
        run: |
          cd upstream
          ./build.sh

      - name: Preflight splash screen and report UI lint findings
        run: |
          cd upstream
          FV=$(sed -n 's/^#define FELUCCA_VERSION "\([^"]*\)".*/\1/p' firmware/src/felucca.c)
          cc -O1 -w "-DFELUCCA_VERSION=\"$FV\"" -Ibuild/gen -Ifirmware/src -Itests -o build/splash_ui_preflight tests/ui_render.c -lm
          mkdir -p build/ui_probe build/ui_slot_probe
          set +e
          build/splash_ui_preflight build/ui_probe build/ui_slot_probe >build/splash_preflight.log 2>&1
          rc=$?
          set -e
          tail -n 12 build/splash_preflight.log
          if [ "$rc" -ne 0 ]; then
            echo "---- SPLASH LINT DETAILS ----"
            grep -E '^(LINT|FIND)' build/ui_probe/report.txt | head -n 100 || true
          fi
          exit "$rc"

      - name: Run Felucca host tests
        run: |
          cd upstream
          tests/run_tests.sh

      - name: Build release firmware
        run: |
          cd upstream
          ./build.sh --release 1.1.5.1
          cp build/felucca-1.1.5.1.fwsc build/felucca-1.1.5.1-s49.fwsc

      - name: Upload installable firmware
        uses: actions/upload-artifact@v7
        with:
          name: felucca-1.1.5.1-s49
          path: upstream/build/felucca-1.1.5.1-s49.fwsc
          if-no-files-found: error
